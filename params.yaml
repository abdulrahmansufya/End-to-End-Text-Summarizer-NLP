TrainingArguments:
  num_train_epochs: 1

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 2e-5
  weight_decay: 0.01

  warmup_steps: 200

  logging_steps: 50

  evaluation_strategy: steps
  eval_steps: 500

  save_strategy: steps
  save_steps: 500
  save_total_limit: 1

  predict_with_generate: true
  generation_max_length: 96
  generation_num_beams: 4